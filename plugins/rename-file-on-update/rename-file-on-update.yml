name: Rename File on Update
description: Renames files when they are updated in Stash using Whisparr v3 naming tokens.
version: 0.2.0
exec:
  - python
  - "{pluginDir}/rename_file_on_update.py"
interface: raw

hooks:
  - name: Rename scene files on update
    description: Rename a scene's files when it is updated.
    triggeredBy:
      - Scene.Update.Post

settings:
  renameUnorganized:
    displayName: Rename unorganized scenes
    description: Rename files for scenes that are not marked as organized.
    type: BOOLEAN
  renameRelatedFiles:
    displayName: Rename/move files with the same name but different extensions
    description: If enabled, the plugin will rename additional files that share the same base name (e.g. .funscript, .vtt).
    type: BOOLEAN
  defaultDirectoryPathFormat:
    displayName: Default directory path format
    description: |
      Folder path using Whisparr v3 brace tokens (e.g. `{Studio CleanTitle}/{Release Year}`).
      See TOKENS.md in the plugin folder. Replaces the legacy `$variable$` syntax from v0.1.x.
    type: STRING
  defaultFileNameFormat:
    displayName: Default file name format
    description: |
      File name (without extension) using Whisparr v3 tokens (e.g. `{Studio CleanTitle} - {Release Date} - {Scene CleanTitle} [{Quality Title}]`).
      The file extension is appended automatically. See TOKENS.md.
    type: STRING
  dryRun:
    displayName: Dry Run
    description: If enabled, the plugin will not actually rename files, but will log what it would do.
    type: BOOLEAN
  duplicateFileSuffix:
    displayName: Duplicate file suffix
    description: |
      Suffix appended when a target file already exists. Use `{index}` for the duplicate counter (default ` ({index})`).
    type: STRING
  removeExtraSpacesFromFileName:
    displayName: Remove extra spaces from file name
    description: If enabled, the plugin will remove extra spaces from the file name.
    type: BOOLEAN
  allowUnsafeCharacters:
    displayName: Allow unsafe characters
    description: If enabled, the plugin will allow unsafe characters in file names and directory paths.
    type: BOOLEAN

tasks:
  - name: Rename scenes
    description: Rename all of your scene's files based on your configuration.
    defaultArgs:
      action: rename-all
